apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragflow-knowledge-portal
  labels:
    app.kubernetes.io/component: ragflow-knowledge-portal
    app.kubernetes.io/instance: ragflow-knowledge-portal
    app.kubernetes.io/managed-by: "${MANAGED_BY}"
    app.kubernetes.io/name: ragflow-knowledge-portal
    app.kubernetes.io/version: "${APP_VERSION}"
    env_instance: "${ENV_INSTANCE}"
    project: "${PROJECT_NAME}"
    service: ragflow-knowledge-portal
    workload: "true"
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app.kubernetes.io/component: ragflow-knowledge-portal
      app.kubernetes.io/instance: ragflow-knowledge-portal
      app.kubernetes.io/name: ragflow-knowledge-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ragflow-knowledge-portal
        app.kubernetes.io/instance: ragflow-knowledge-portal
        app.kubernetes.io/managed-by: "${MANAGED_BY}"
        app.kubernetes.io/name: ragflow-knowledge-portal
        app.kubernetes.io/version: "${APP_VERSION}"
        env_instance: "${ENV_INSTANCE}"
        project: "${PROJECT_NAME}"
        service: ragflow-knowledge-portal
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: ragflow-knowledge-portal
                    app.kubernetes.io/instance: ragflow-knowledge-portal
                    app.kubernetes.io/name: ragflow-knowledge-portal
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ragflow-knowledge-portal
          image: "${IMAGE}"
          imagePullPolicy: "${IMAGE_PULL_POLICY}"
          envFrom:
            - secretRef:
                name: ragflow-knowledge-portal-secret
            - configMapRef:
                name: ragflow-knowledge-portal-config
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /docs
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: "${REQUEST_CPU}"
              memory: "${REQUEST_MEMORY}"
            limits:
              cpu: "${LIMIT_CPU}"
              memory: "${LIMIT_MEMORY}"
