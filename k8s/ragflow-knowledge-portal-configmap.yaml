apiVersion: v1
kind: ConfigMap
metadata:
  name: ragflow-knowledge-portal-config
  annotations:
    env_instance: "${ENV_INSTANCE}"
    project: "${PROJECT_NAME}"
  labels:
    app.kubernetes.io/component: ragflow-knowledge-portal
    app.kubernetes.io/instance: ragflow-knowledge-portal
    app.kubernetes.io/name: ragflow-knowledge-portal
    service: ragflow-knowledge-portal
data:
  RAGFLOW_BASE_URL: "${RAGFLOW_BASE_URL}"
  RAGFLOW_TIMEOUT: "${RAGFLOW_TIMEOUT}"
  RAG_INFO_SYNC_URL: "${RAG_INFO_SYNC_URL}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
  LLM_BASE_URL: "${LLM_BASE_URL}"
  LLM_MODEL: "${LLM_MODEL}"
  LLM_TIMEOUT: "${LLM_TIMEOUT}"
  SERVICE_HOST: "0.0.0.0"
  SERVICE_PORT: "${SERVICE_PORT}"
