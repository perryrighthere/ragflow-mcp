apiVersion: v1
kind: Secret
metadata:
  name: ragflow-knowledge-portal-secret
  annotations:
    env_instance: "${ENV_INSTANCE}"
    project: "${PROJECT_NAME}"
  labels:
    app.kubernetes.io/component: ragflow-knowledge-portal
    app.kubernetes.io/instance: ragflow-knowledge-portal
    app.kubernetes.io/name: ragflow-knowledge-portal
    service: ragflow-knowledge-portal
type: Opaque
stringData:
  RAGFLOW_API_KEY: "${RAGFLOW_API_KEY}"
  LLM_API_KEY: "${LLM_API_KEY}"
  CONVERSATION_MYSQL_PASSWORD: "${CONVERSATION_MYSQL_PASSWORD}"
